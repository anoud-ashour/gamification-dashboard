# Deploys apps-script/Code.gs to Google Apps Script when it changes on main.
# Setup (once): see apps-script/README.md. Secrets needed: CLASPRC_JSON, APPS_SCRIPT_ID, APPS_SCRIPT_DEPLOYMENT_ID
name: Deploy mailer (Apps Script)

on:
  push:
    branches: [main]
    paths: ['apps-script/**']
  workflow_dispatch:

concurrency: deploy-mailer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Log in and point clasp at the project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$APPS_SCRIPT_ID" > .clasp.json
      - name: Push code
        run: clasp push --force
      - name: Update the existing web app deployment (URL stays the same)
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
